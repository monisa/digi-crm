name: Deploy to Hostinger

# Manual: Actions -> "Deploy to Hostinger" -> Run workflow.
# The first run sets the server up (code, settings, database, admin login);
# later runs update it. Nothing secret is stored in the repository.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   HOSTINGER_HOST        SSH IP from hPanel -> Advanced -> SSH Access
#   HOSTINGER_PASSWORD    SSH password            (or HOSTINGER_SSH_KEY: a private key)
#   DB_PASSWORD           password of the MySQL user
#   MAIL_PASSWORD         password of info@digifoxprosolutions.com
#   ADMIN_EMAIL           first CRM admin login
#   ADMIN_PASSWORD        its password (8+ characters, letters and numbers)
# Optional secrets, copied into the server settings on every run when set:
#   META_APP_SECRET       Meta app → App settings → Basic → App secret (Lead Ads)
#   META_VERIFY_TOKEN     any long phrase you choose; type the same in the Meta webhook setup
# Repository variables (same page -> Variables), optional:
#   HOSTINGER_USER (u311568037)  HOSTINGER_PORT (65002)  DB_DATABASE / DB_USERNAME (u311568037_crm)
#   SITE_ROOT (domains/digifoxprosolutions.com/public_html/crm)  ADMIN_NAME  GOOGLE_CLIENT_ID
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: main

concurrency: deploy-hostinger

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
      SSH_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
      SSH_USER: ${{ vars.HOSTINGER_USER || 'u311568037' }}
      SITE_ROOT: ${{ vars.SITE_ROOT || 'domains/digifoxprosolutions.com/public_html/crm' }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check secrets
        run: |
          missing=""
          for s in HOSTINGER_HOST DB_PASSWORD MAIL_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          [ -n "$HOSTINGER_PASSWORD$HOSTINGER_SSH_KEY" ] || missing="$missing HOSTINGER_PASSWORD(or HOSTINGER_SSH_KEY)"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Angular app
        working-directory: web
        run: npm ci && npx ng build

      - name: Prepare SSH
        shell: bash
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HAS_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sudo apt-get -qq install -y sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Accept HOSTINGER_HOST written as "1.2.3.4", "u311568037@1.2.3.4" or the full "ssh -p 65002 u311568037@1.2.3.4".
          HOST=$(echo "$SSH_HOST" | tr -s ' ' '\n' | grep -v '^-' | grep -vE '^(ssh|[0-9]{2,5})$' | tail -1)
          HOST=${HOST##*@}
          PORT=$(echo "$SSH_HOST" | grep -oE -- '-p ?[0-9]+' | grep -oE '[0-9]+' || true)
          echo "SSH_HOST=$HOST" >> "$GITHUB_ENV"
          [ -n "$PORT" ] && echo "SSH_PORT=$PORT" >> "$GITHUB_ENV" || true
          echo "Connecting to: user $SSH_USER, port ${PORT:-$SSH_PORT}, host ${HOST:0:3}***"
          if [ -n "$KEY" ]; then
            # Tidy up common paste problems: Windows line endings, literal \n, missing final newline.
            printf '%s\n' "$KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
              mv ~/.ssh/id_deploy ~/.ssh/id_deploy.unusable
              if grep -qE '^(ssh-(ed25519|rsa)|ecdsa-)' <<<"$KEY"; then why="it is a PUBLIC key (starts with ssh-ed25519/ssh-rsa); the secret needs the PRIVATE key"; else why="it is not a complete private key (it must include the -----BEGIN ... and -----END ... lines)"; fi
              if [ -n "$HAS_PASSWORD" ]; then
                echo "::warning::HOSTINGER_SSH_KEY was ignored: $why. Logging in with HOSTINGER_PASSWORD instead."
              else
                echo "::error::HOSTINGER_SSH_KEY cannot be used: $why. Fix it, or delete it and add HOSTINGER_PASSWORD (the SSH password from hPanel → Advanced → SSH Access)."
                exit 1
              fi
            fi
          fi
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 25\n  ServerAliveInterval 20\n' > ~/.ssh/config

      - name: Test the SSH login
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          if [ -f ~/.ssh/id_deploy ]; then RUN="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -p $SSH_PORT"; else RUN="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $SSH_PORT"; fi
          if out=$($RUN "$SSH_USER@$SSH_HOST" 'echo LOGIN-OK; php -r "echo PHP_VERSION;"' 2>&1); then
            echo "$out"
          else
            echo "$out" | grep -viE 'password|pass:' | tail -5
            echo "::error::Could not log in to Hostinger over SSH. Check: (1) HOSTINGER_HOST is only the IP from hPanel → Advanced → SSH Access; (2) SSH access is enabled there; (3) port is 65002 (or set the HOSTINGER_PORT variable); (4) HOSTINGER_PASSWORD is the SSH password shown/changed on that page (not the hPanel login); (5) username is $SSH_USER (or set the HOSTINGER_USER variable)."
            exit 1
          fi

      - name: Write the settings file (used only on the first run)
        env:
          DB_DATABASE: ${{ vars.DB_DATABASE || 'u311568037_crm' }}
          DB_USERNAME: ${{ vars.DB_USERNAME || 'u311568037_crm' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          umask 077
          cp api/.env.example deploy.env
          set_env() { python3 - "$1" "$2" <<'PY'
          import sys, re
          key, val = sys.argv[1], sys.argv[2]
          text = open('deploy.env').read()
          line = f'{key}="{val}"' if any(c in val for c in ' #"$') else f'{key}={val}'
          text, n = re.subn(rf'^{key}=.*$', lambda m: line, text, flags=re.M)
          if not n: text += f'\n{line}\n'
          open('deploy.env', 'w').write(text)
          PY
          }
          set_env APP_KEY "base64:$(openssl rand -base64 32)"
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env LOG_LEVEL warning
          set_env DB_HOST localhost
          set_env DB_DATABASE "$DB_DATABASE"
          set_env DB_USERNAME "$DB_USERNAME"
          set_env DB_PASSWORD "$DB_PASSWORD"
          set_env MAIL_PASSWORD "$MAIL_PASSWORD"
          set_env META_VERIFY_TOKEN "$(openssl rand -hex 24)"
          set_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"

      - name: Set up / update the server
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME || 'Admin' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
        run: |
          if [ -f ~/.ssh/id_deploy ]; then RUN="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT"; else RUN="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $SSH_PORT"; fi
          if [ -f ~/.ssh/id_deploy ]; then COPY="scp -i $HOME/.ssh/id_deploy -P $SSH_PORT"; else COPY="sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no -P $SSH_PORT"; fi
          # Settings file: copied only if the server does not have one yet (never overwrite the app key).
          if ! $RUN "$SSH_USER@$SSH_HOST" 'test -f ~/digi-crm/api/.env'; then
            $COPY deploy.env "$SSH_USER@$SSH_HOST:.digi-crm.env.new"
          fi
          rm -f deploy.env
          $COPY deploy/server-deploy.sh "$SSH_USER@$SSH_HOST:.digi-crm-deploy.sh"
          # Admin details go through the SSH session's input, not the command line.
          # Meta Lead Ads keys travel the same way and are written into the server's .env.
          printf 'export CRM_ADMIN_EMAIL=%q CRM_ADMIN_PASSWORD=%q CRM_ADMIN_NAME=%q BRANCH=%q SITE_ROOT=%q SET_META_APP_SECRET=%q SET_META_VERIFY_TOKEN=%q\nbash ~/.digi-crm-deploy.sh\n' \
            "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$ADMIN_NAME" "$BRANCH" "$SITE_ROOT" "$META_APP_SECRET" "$META_VERIFY_TOKEN" | $RUN "$SSH_USER@$SSH_HOST" 'bash -s'

      - name: Upload the app
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          if [ -f ~/.ssh/id_deploy ]; then E="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT"; else E="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $SSH_PORT"; fi
          rsync -az --delete --exclude 'api' --exclude '.well-known' -e "$E" web/dist/web/browser/ "$SSH_USER@$SSH_HOST:$SITE_ROOT/"

      - name: Check it is live
        run: |
          sleep 3
          curl -fsS https://crm.digifoxprosolutions.com/api/v1/health && echo
          curl -fsS -o /dev/null -w "Website: HTTP %{http_code}\n" https://crm.digifoxprosolutions.com/login
